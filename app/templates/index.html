<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iron Eye System - Tactical HUD</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0e17;
            color: #00ff88;
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* === SCAN LINES OVERLAY === */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 255, 136, 0.015) 2px,
                rgba(0, 255, 136, 0.015) 4px
            );
            pointer-events: none;
            z-index: 9999;
        }

        /* === HEADER === */
        .header {
            background: linear-gradient(180deg, rgba(0, 255, 136, 0.08) 0%, transparent 100%);
            border-bottom: 1px solid rgba(0, 255, 136, 0.3);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            width: 45px;
            height: 45px;
            border: 2px solid #00ff88;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            animation: pulse-glow 2s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 5px rgba(0, 255, 136, 0.3); }
            50% { box-shadow: 0 0 20px rgba(0, 255, 136, 0.6); }
        }

        .system-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #00ff88, #00ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .system-subtitle {
            font-size: 11px;
            color: rgba(0, 255, 136, 0.5);
            letter-spacing: 5px;
        }

        .header-right {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: rgba(0, 255, 136, 0.7);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            animation: blink 1.5s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .clock {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            color: #00ccff;
        }

        /* === MAIN LAYOUT === */
        .main-container {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 20px;
            padding: 20px 30px;
            height: calc(100vh - 85px);
        }

        /* === IMAGE VIEWPORT === */
        .viewport {
            background: #0d1220;
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .viewport::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border: 1px solid rgba(0, 255, 136, 0.1);
            border-radius: 8px;
            pointer-events: none;
        }

        /* Corner brackets */
        .viewport::after {
            content: '';
            position: absolute;
            top: 10px; left: 10px; right: 10px; bottom: 10px;
            border: 1px solid rgba(0, 255, 136, 0.08);
            pointer-events: none;
        }

        .corner {
            position: absolute;
            width: 25px;
            height: 25px;
            border-color: #00ff88;
            border-style: solid;
            z-index: 10;
        }
        .corner.tl { top: 8px; left: 8px; border-width: 2px 0 0 2px; }
        .corner.tr { top: 8px; right: 8px; border-width: 2px 2px 0 0; }
        .corner.bl { bottom: 8px; left: 8px; border-width: 0 0 2px 2px; }
        .corner.br { bottom: 8px; right: 8px; border-width: 0 2px 2px 0; }

        .viewport-label {
            position: absolute;
            top: 15px;
            left: 40px;
            font-size: 10px;
            color: rgba(0, 255, 136, 0.5);
            letter-spacing: 3px;
            z-index: 10;
        }

        /* === UPLOAD ZONE === */
        .upload-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            height: 100%;
        }

        .upload-zone:hover {
            background: rgba(0, 255, 136, 0.03);
        }

        .upload-zone.dragover {
            background: rgba(0, 255, 136, 0.08);
            border: 2px dashed #00ff88;
        }

        .upload-icon {
            width: 80px;
            height: 80px;
            border: 2px dashed rgba(0, 255, 136, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            transition: all 0.3s ease;
        }

        .upload-zone:hover .upload-icon {
            border-color: #00ff88;
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.2);
        }

        .upload-text {
            font-size: 14px;
            color: rgba(0, 255, 136, 0.5);
            text-align: center;
        }

        .upload-text span {
            color: #00ff88;
            text-decoration: underline;
            cursor: pointer;
        }

        .result-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
            z-index: 5;
        }

        /* === SIDEBAR === */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            overflow-x: hidden;
            min-height: 0;
            padding-right: 4px;
        }

        .panel {
            background: rgba(13, 18, 32, 0.9);
            border: 1px solid rgba(0, 255, 136, 0.15);
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .panel.detections-panel {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel.detections-panel .panel-body {
            flex: 1;
            min-height: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            background: rgba(0, 255, 136, 0.06);
            padding: 10px 15px;
            border-bottom: 1px solid rgba(0, 255, 136, 0.1);
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #00ccff;
        }

        .panel-body {
            padding: 15px;
        }

        /* === CONFIDENCE SLIDER === */
        .slider-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
        }

        .slider-value {
            color: #00ccff;
            font-family: 'Orbitron', sans-serif;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: rgba(0, 255, 136, 0.15);
            border-radius: 2px;
            outline: none;
        }

        /* === SWITCH STYLE === */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider-switch {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 255, 136, 0.1);
            transition: .4s;
            border-radius: 24px;
            border: 1px solid rgba(0, 255, 136, 0.3);
        }
        .slider-switch:before {
            position: absolute;
            content: "";
            height: 16px; width: 16px;
            left: 3px; bottom: 3px;
            background-color: #00ff88;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider-switch { background-color: rgba(0, 255, 136, 0.3); }
        input:checked + .slider-switch:before { transform: translateX(26px); }

        /* === TOOLTIP === */
        #tacticalTooltip {
            position: fixed;
            background: rgba(10, 14, 23, 0.9);
            border: 1px solid #00ff88;
            color: #00ff88;
            padding: 8px 12px;
            font-size: 11px;
            font-family: 'Orbitron', sans-serif;
            pointer-events: none;
            z-index: 1000;
            display: none;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
            border-left: 4px solid #00ff88;
        }

        /* === HOVER BOX === */
        #hoverBox {
            position: absolute;
            border: 2px solid #00ccff;
            box-shadow: 0 0 15px rgba(0, 204, 255, 0.5), inset 0 0 10px rgba(0, 204, 255, 0.2);
            pointer-events: none;
            z-index: 4; /* Below high overlays but above image */
            display: none;
            transition: all 0.05s linear;
        }
        #hoverBox::before {
            content: '';
            position: absolute;
            top: -5px; left: -5px; width: 10px; height: 10px;
            border-top: 2px solid #00ccff; border-left: 2px solid #00ccff;
        }
        #hoverBox::after {
            content: '';
            position: absolute;
            bottom: -5px; right: -5px; width: 10px; height: 10px;
            border-bottom: 2px solid #00ccff; border-right: 2px solid #00ccff;
        }

        .result-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
            z-index: 3;
        }

        .scan-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.15), rgba(0, 204, 255, 0.1));
            border: 1px solid rgba(0, 255, 136, 0.4);
            color: #00ff88;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 3px;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .scan-btn:hover {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.25), rgba(0, 204, 255, 0.2));
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.2);
            transform: translateY(-1px);
        }

        .scan-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .scan-btn.scanning {
            animation: scan-pulse 1s ease-in-out infinite;
        }

        @keyframes scan-pulse {
            0%, 100% { border-color: rgba(0, 255, 136, 0.4); }
            50% { border-color: rgba(0, 204, 255, 0.8); box-shadow: 0 0 40px rgba(0, 204, 255, 0.3); }
        }

        /* === STATS === */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat-card {
            background: rgba(0, 255, 136, 0.04);
            border: 1px solid rgba(0, 255, 136, 0.1);
            border-radius: 6px;
            padding: 12px;
            text-align: center;
        }

        .stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 900;
            color: #00ff88;
        }

        .stat-label {
            font-size: 10px;
            color: rgba(0, 255, 136, 0.5);
            letter-spacing: 1px;
            margin-top: 4px;
        }

        /* === HEAT ZONE === */
        .heatzone-wrapper {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .heatzone-canvas-container {
            flex: 1;
            min-height: 120px;
            position: relative;
            border: 1px solid rgba(0, 255, 136, 0.15);
            border-radius: 6px;
            overflow: hidden;
            background: #080c14;
        }

        #heatCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .heatzone-legend {
            display: flex;
            justify-content: center;
            gap: 12px;
            font-size: 10px;
            color: rgba(0, 255, 136, 0.5);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .class-summary {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .class-tag {
            background: rgba(0, 255, 136, 0.08);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 4px;
            padding: 4px 10px;
            font-size: 11px;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .class-tag-count {
            background: rgba(0, 255, 136, 0.2);
            border-radius: 3px;
            padding: 1px 6px;
            font-weight: 700;
            color: #00ff88;
        }

        /* === EMPTY STATE === */
        .empty-state {
            text-align: center;
            padding: 20px;
            color: rgba(0, 255, 136, 0.3);
            font-size: 12px;
        }

        /* === LOADING OVERLAY === */
        .loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 14, 23, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
            z-index: 100;
        }

        .loading-overlay.active {
            display: flex;
        }

        .radar-scanner {
            width: 80px;
            height: 80px;
            border: 2px solid rgba(0, 255, 136, 0.3);
            border-radius: 50%;
            position: relative;
        }

        .radar-scanner::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 50%;
            height: 2px;
            background: linear-gradient(90deg, #00ff88, transparent);
            transform-origin: left center;
            animation: radar-spin 1.5s linear infinite;
        }

        @keyframes radar-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            letter-spacing: 3px;
            animation: blink 1s ease-in-out infinite;
        }

        /* === SCROLLBAR === */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 255, 136, 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0, 255, 136, 0.6); }

        /* Hidden file input */
        #fileInput { display: none; }

        /* Hidden file input */
        #fileInput { display: none; }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <div class="header-left">
            <div class="logo-icon">🦅</div>
            <div>
                <div class="system-title">Iron Eye</div>
                <div class="system-subtitle">Tactical Vision System</div>
            </div>
        </div>
        <div class="header-right">
            <div class="status-indicator">
                <div class="status-dot"></div>
                <span>MODEL ONLINE</span>
            </div>
            <div class="clock" id="clock">--:--:--</div>
        </div>
    </header>

    <!-- MAIN -->
    <div class="main-container">
        <!-- IMAGE VIEWPORT -->
        <div class="viewport" id="viewport">
            <div class="corner tl"></div>
            <div class="corner tr"></div>
            <div class="corner bl"></div>
            <div class="corner br"></div>
            <div class="viewport-label">THERMAL FEED</div>

            <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
                <div class="upload-icon">📡</div>
                <div class="upload-text">
                    اسحب الصورة الحرارية هنا<br>
                    أو <span>اختر ملف</span>
                </div>
            </div>

            <img class="result-image" id="resultImage" alt="Analyzed Image">
            <div id="hoverBox"></div>
            <div id="tacticalTooltip"></div>

            <div class="loading-overlay" id="loadingOverlay">
                <div class="radar-scanner"></div>
                <div class="loading-text">SCANNING TARGETS...</div>
            </div>

            <input type="file" id="fileInput" accept="image/*">
        </div>

        <!-- SIDEBAR -->
        <div class="sidebar">
            <!-- Controls -->
            <div class="panel">
                <div class="panel-header">⚙ Control Panel</div>
                <div class="panel-body">
                    <div class="slider-container">
                        <div class="slider-label">
                            <span>Intelligence Mode</span>
                            <span class="slider-value" id="modeStatus">OFF</span>
                        </div>
                        <label class="switch">
                            <input type="checkbox" id="modeToggle">
                            <span class="slider-switch"></span>
                        </label>
                    </div>
                    <br>
                    <div class="slider-container">
                        <div class="slider-label">
                            <span>Confidence Threshold</span>
                            <span class="slider-value" id="confValue">0.25</span>
                        </div>
                        <input type="range" id="confSlider" min="0.1" max="0.9" step="0.05" value="0.25">
                    </div>
                    <br>
                    <button class="scan-btn" id="scanBtn" disabled onclick="analyzeImage()">
                        ⚡ SCAN TARGET
                    </button>
                </div>
            </div>



            <!-- Heat Zone -->
            <div class="panel detections-panel">
                <div class="panel-header">🌡 Heat Zone Map</div>
                <div class="panel-body">
                    <div class="heatzone-wrapper">
                        <div class="heatzone-canvas-container">
                            <canvas id="heatCanvas"></canvas>
                        </div>
                        <div class="heatzone-legend">
                            <div class="legend-item"><div class="legend-dot" style="background:#00ff88"></div> Low</div>
                            <div class="legend-item"><div class="legend-dot" style="background:#ffaa00"></div> Medium</div>
                            <div class="legend-item"><div class="legend-dot" style="background:#ff4444"></div> High</div>
                        </div>
                        <div class="class-summary" id="classSummary">
                            <div class="empty-state" style="width:100%">AWAITING SCAN DATA</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // === CLOCK ===
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('en-US', { hour12: false });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // === CONFIDENCE SLIDER ===
        const confSlider = document.getElementById('confSlider');
        const confValue = document.getElementById('confValue');
        confSlider.addEventListener('input', () => {
            confValue.textContent = parseFloat(confSlider.value).toFixed(2);
        });

        // === FILE HANDLING ===
        const fileInput = document.getElementById('fileInput');
        const uploadZone = document.getElementById('uploadZone');
        const resultImage = document.getElementById('resultImage');
        const scanBtn = document.getElementById('scanBtn');
        let selectedFile = null;

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                previewImage(selectedFile);
            }
        });

        // Drag & Drop
        const viewport = document.getElementById('viewport');
        viewport.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });
        viewport.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });
        viewport.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                selectedFile = e.dataTransfer.files[0];
                previewImage(selectedFile);
            }
        });

        function previewImage(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                resultImage.src = e.target.result;
                resultImage.style.display = 'block';
                uploadZone.style.display = 'none';
                scanBtn.disabled = false;
            };
            reader.readAsDataURL(file);
        }

        // === DATA REPOSITORY ===
        let currentDetections = [];
        let originalImgData = null;
        let annotatedImgData = null;
        let isIntelligenceMode = false;

        const modeToggle = document.getElementById('modeToggle');
        const modeStatus = document.getElementById('modeStatus');
        const tacticalTooltip = document.getElementById('tacticalTooltip');
        const hoverBox = document.getElementById('hoverBox');

        modeToggle.addEventListener('change', () => {
            isIntelligenceMode = modeToggle.checked;
            modeStatus.textContent = isIntelligenceMode ? 'ON' : 'OFF';
            modeStatus.style.color = isIntelligenceMode ? '#00ccff' : '#00ff88';
            if (!isIntelligenceMode) hoverBox.style.display = 'none';
            updateDisplayMode();
        });

        function updateDisplayMode() {
            if (!originalImgData || !annotatedImgData) return;
            resultImage.src = 'data:image/png;base64,' + (isIntelligenceMode ? originalImgData : annotatedImgData);
        }

        // Mouse Hover Logic
        resultImage.addEventListener('mousemove', (e) => {
            if (!isIntelligenceMode || currentDetections.length === 0) {
                tacticalTooltip.style.display = 'none';
                hoverBox.style.display = 'none';
                return;
            }

            const rect = resultImage.getBoundingClientRect();
            
            // Calculate actual image display dimensions (accounting for object-fit: contain)
            const ratio = Math.min(rect.width / resultImage.naturalWidth, rect.height / resultImage.naturalHeight);
            const actualImgWidth = resultImage.naturalWidth * ratio;
            const actualImgHeight = resultImage.naturalHeight * ratio;
            const offsetX = (rect.width - actualImgWidth) / 2;
            const offsetY = (rect.height - actualImgHeight) / 2;

            // Mouse position relative to the resultImage element
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            // Scale mouse coordinates to match original image dimensions
            const imgX = (mouseX - offsetX) / ratio;
            const imgY = (mouseY - offsetY) / ratio;

            let found = false;
            for (const det of currentDetections) {
                const [x1, y1, x2, y2] = det.bbox;
                if (imgX >= x1 && imgX <= x2 && imgY >= y1 && imgY <= y2) {
                    // Update Tooltip
                    tacticalTooltip.innerHTML = `
                        <div style="color:#00ccff; border-bottom:1px solid rgba(0,204,255,0.3); padding-bottom:4px; margin-bottom:4px;">TARGET ACQUIRED</div>
                        CLASS: ${det.class.toUpperCase()}<br>
                        CONF: ${(det.confidence * 100).toFixed(1)}%<br>
                        COORD: [${Math.round(imgX)}, ${Math.round(imgY)}]
                    `;
                    tacticalTooltip.style.display = 'block';
                    tacticalTooltip.style.left = (e.clientX + 15) + 'px';
                    tacticalTooltip.style.top = (e.clientY + 15) + 'px';

                    // Update Hover Box (relative to viewport/parent)
                    hoverBox.style.width = (x2 - x1) * ratio + 'px';
                    hoverBox.style.height = (y2 - y1) * ratio + 'px';
                    hoverBox.style.left = (x1 * ratio + offsetX) + 'px';
                    hoverBox.style.top = (y1 * ratio + offsetY) + 'px';
                    hoverBox.style.display = 'block';

                    found = true;
                    break;
                }
            }

            if (!found) {
                tacticalTooltip.style.display = 'none';
                hoverBox.style.display = 'none';
            }
        });

        resultImage.addEventListener('mouseleave', () => {
            tacticalTooltip.style.display = 'none';
            hoverBox.style.display = 'none';
        });

        // === ANALYZE ===
        async function analyzeImage() {
            if (!selectedFile) return;

            const loadingOverlay = document.getElementById('loadingOverlay');
            loadingOverlay.classList.add('active');
            scanBtn.classList.add('scanning');
            scanBtn.disabled = true;

            const startTime = performance.now();

            const formData = new FormData();
            formData.append('image', selectedFile);
            formData.append('confidence', confSlider.value);

            try {
                const response = await fetch('/analyze', { method: 'POST', body: formData });
                const data = await response.json();

                const endTime = performance.now();
                const scanTime = ((endTime - startTime) / 1000).toFixed(1);

                // Update Data
                currentDetections = data.detections;
                originalImgData = data.original_image;
                annotatedImgData = data.image;

                // Update image based on mode
                updateDisplayMode();

                // Update stats
                // document.getElementById('totalTargets').textContent = data.total_targets;
                // document.getElementById('imgSize').textContent = data.image_size;
                // document.getElementById('scanTime').textContent = scanTime + 's';

                // Calculate average confidence
                if (data.detections.length > 0) {
                    const avgConfidence = data.detections.reduce((sum, d) => sum + d.confidence, 0) / data.detections.length;
                    // document.getElementById('avgConf').textContent = (avgConfidence * 100).toFixed(0) + '%';
                } else {
                    // document.getElementById('avgConf').textContent = '--';
                }

                // Update heat zone & class summary
                drawHeatZone(data.detections, data.image_size);
                updateClassSummary(data.class_counts);

            } catch (error) {
                console.error('Analysis failed:', error);
                alert('خطأ في التحليل: ' + error.message);
            } finally {
                loadingOverlay.classList.remove('active');
                scanBtn.classList.remove('scanning');
                scanBtn.disabled = false;
            }
        }

        function drawHeatZone(detections, imgSize) {
            const canvas = document.getElementById('heatCanvas');
            const container = canvas.parentElement;
            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;
            const ctx = canvas.getContext('2d');

            // Clear canvas
            ctx.fillStyle = '#080c14';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid
            ctx.strokeStyle = 'rgba(0, 255, 136, 0.06)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i < canvas.width; i += 20) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for (let i = 0; i < canvas.height; i += 20) {
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }

            if (detections.length === 0) return;

            // Parse image dimensions
            const [imgW, imgH] = imgSize.split('x').map(Number);
            const scaleX = canvas.width / imgW;
            const scaleY = canvas.height / imgH;

            // Draw heat zones as radial gradients
            detections.forEach(det => {
                const [x1, y1, x2, y2] = det.bbox;
                const cx = ((x1 + x2) / 2) * scaleX;
                const cy = ((y1 + y2) / 2) * scaleY;
                const radius = Math.max((x2 - x1) * scaleX, (y2 - y1) * scaleY) * 1.2;
                const conf = det.confidence;

                // Color based on confidence
                let r, g, b;
                if (conf >= 0.7) { r = 255; g = 68; b = 68; }        // High - Red
                else if (conf >= 0.4) { r = 255; g = 170; b = 0; }   // Medium - Orange
                else { r = 0; g = 255; b = 136; }                     // Low - Green

                const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
                gradient.addColorStop(0, `rgba(${r}, ${g}, ${b}, 0.6)`);
                gradient.addColorStop(0.5, `rgba(${r}, ${g}, ${b}, 0.2)`);
                gradient.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);

                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Draw center crosshair
                ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, 0.8)`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(cx - 5, cy); ctx.lineTo(cx + 5, cy);
                ctx.moveTo(cx, cy - 5); ctx.lineTo(cx, cy + 5);
                ctx.stroke();
            });

            // Border glow
            ctx.strokeStyle = 'rgba(0, 255, 136, 0.2)';
            ctx.lineWidth = 1;
            ctx.strokeRect(0, 0, canvas.width, canvas.height);
        }

        function updateClassSummary(classCounts) {
            const summary = document.getElementById('classSummary');
            if (!classCounts || Object.keys(classCounts).length === 0) {
                summary.innerHTML = '<div class="empty-state" style="width:100%">NO TARGETS</div>';
                return;
            }
            summary.innerHTML = Object.entries(classCounts).map(([cls, count]) => {
                return `<div class="class-tag"><span>${cls.toUpperCase()}</span><span class="class-tag-count">${count}</span></div>`;
            }).join('');
        }

        // === RE-UPLOAD (click on result image) ===
        resultImage.addEventListener('click', () => {
            document.getElementById('fileInput').click();
        });
    </script>
